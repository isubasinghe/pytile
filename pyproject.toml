[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pytile-compiler"
version = "0.1.0"
description = "A learning compiler from a Python subset to CUDA Tile IR"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "numpy>=2", "ruff>=0.8"]

[project.scripts]
pytile = "pytile.__main__:main"

[tool.setuptools.packages.find]
include = ["pytile*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I"]
